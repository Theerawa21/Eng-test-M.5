<style>

, "seat": 34, "user": "u15250898", "pw": "S5rgXzMy"}, {"sid": "20517", "name": "นางสาวอธิชา ช่องโก้", "cls": "ม.5/5", "room": "M5.5", "seat": 35, "user": "u15250899", "pw": "XmKZ9kM7"}, {"sid": "20542", "name": "นายกิตติวัฒน์ สุธรรม", "cls": "ม.5/5", "room": "M5.5", "seat": 36, "user": "u15250900", "pw": "tb2XqiUk"}];
const resultsEl=document.getElementById('results');
const qEl=document.getElementById('q');

function markDigits(s){return s.replace(/[0-9]/g,d=>'<span class="dig">'+d+'</span>');}
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function copyIcon(){return '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>';}
function checkIcon(){return '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';}

function idleState(){
  const counts={};
  STUDENTS.forEach(s=>counts[s.room]=(counts[s.room]||0)+1);
  const chips=Object.keys(counts).sort().map(r=>`<span class="chip">${r} · ${counts[r]} คน</span>`).join('');
  resultsEl.innerHTML=`<div class="idle">
    <div class="big">🔎</div>
    <p>ยังไม่ได้ค้นหา</p>
    <p>พิมพ์รหัสประจำตัวนักเรียนในช่องด้านบนเพื่อเริ่ม</p>
    <div class="roomsline">${chips}</div>
  </div>`;
}

function render(list, q){
  if(list.length===0){
    resultsEl.innerHTML=`<div class="noresult">ไม่พบนักเรียนที่ตรงกับ “${esc(q)}”<br><span style="font-size:13px">ลองตรวจตัวเลขอีกครั้ง หรือพิมพ์ชื่อ</span></div>`;
    return;
  }
  const single = list.length===1;
  let head=`<div class="count">พบ ${list.length} คน${single?'':' — พิมพ์รหัสให้ครบเพื่อให้เหลือคนเดียว'}</div>`;
  const cards=list.map(s=>{
    const meta=`ชั้น ${esc(s.cls)} · เลขที่ ${s.seat} · ห้อง ${s.room}`;
    return `<div class="card${single?' single':''}">
      <div class="idrow">
        <span class="idpill">รหัส ${esc(s.sid)}</span>
        <span class="roompill">${s.room}</span>
      </div>
      <div class="name">${esc(s.name)}</div>
      <div class="metaline">${meta}</div>
      <div class="field">
        <div class="flab">Username</div>
        <div class="credrow">
          <span class="cred">${markDigits(esc(s.user))}</span>
          <button class="cbtn" title="คัดลอก username" onclick='copyText(${JSON.stringify(s.user)},this,"คัดลอก username แล้ว")'>${copyIcon()}</button>
        </div>
      </div>
      <div class="field">
        <div class="flab">Password</div>
        <div class="credrow">
          <span class="cred">${markDigits(esc(s.pw))}</span>
          <button class="cbtn" title="คัดลอก password" onclick='copyText(${JSON.stringify(s.pw)},this,"คัดลอก password แล้ว")'>${copyIcon()}</button>
        </div>
      </div>
      <button class="copyall" onclick='copyAll(${JSON.stringify(s.user)},${JSON.stringify(s.pw)},this)'>
        ${copyIcon()} คัดลอกทั้งหมด (user · pass · Org ID)
      </button>
    </div>`;
  }).join('');
  resultsEl.innerHTML=head+cards;
}

function search(){
  const raw=qEl.value.trim();
  if(!raw){idleState();return;}
  const q=raw.toLowerCase();
  const isNum=/^[0-9]+$/.test(raw);
  let list;
  if(isNum){
    // student ID match: prefix first, then contains
    const pref=STUDENTS.filter(s=>s.sid.startsWith(raw));
    list = pref.length?pref:STUDENTS.filter(s=>s.sid.includes(raw));
  }else{
    list=STUDENTS.filter(s=>s.name.toLowerCase().includes(q)||s.user.toLowerCase().includes(q));
  }
  list=list.slice(0,30);
  render(list, raw);
}
qEl.addEventListener('input', search);

/* clipboard */
async function toClipboard(text){
  try{await navigator.clipboard.writeText(text);return true;}
  catch(e){
    const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);ta.select();let ok=false;
    try{ok=document.execCommand('copy');}catch(_){}
    document.body.removeChild(ta);return ok;
  }
}
function toast(msg){
  const t=document.getElementById('toast');
  t.innerHTML=checkIcon()+'<span>'+msg+'</span>';
  t.classList.add('show');clearTimeout(t._t);
  t._t=setTimeout(()=>t.classList.remove('show'),1500);
}
async function copyText(text,btn,msg){
  const ok=await toClipboard(text);
  if(ok){
    if(btn&&btn.classList.contains('cbtn')){
      const o=btn.innerHTML;btn.innerHTML=checkIcon();btn.classList.add('done');
      setTimeout(()=>{btn.innerHTML=o;btn.classList.remove('done');},1200);
    }
    toast(msg||'คัดลอกแล้ว');
  }else toast('คัดลอกไม่สำเร็จ');
}
async function copyAll(user,pass,btn){
  const block=`Username: ${user}\nPassword: ${pass}\nOrg ID: ${ORG}`;
  const ok=await toClipboard(block);
  if(ok){const o=btn.innerHTML;btn.innerHTML=checkIcon()+' คัดลอกแล้ว';setTimeout(()=>btn.innerHTML=o,1200);
    toast('คัดลอก user · pass · Org ID แล้ว');}
  else toast('คัดลอกไม่สำเร็จ');
}

idleState();
</script>
